# HODL's deployment of Doop on Porter (GCP cluster). Steps: docs/deploy-porter.md.
# Reference: https://docs.porter.run/applications/configuration-as-code/reference
version: v2
name: doop

build:
  method: docker
  context: .
  dockerfile: ./Dockerfile

# Values that are not secret. Secrets and per-account settings live in the
# `doop` env group (created in the Porter dashboard before the first deploy).
env:
  BETTER_AUTH_URL: https://doop.hodlmarkets.com
  SIGNUP_EMAIL_DOMAINS: hodlmarkets.com

envGroups:
  - doop

services:
  - name: web
    type: web
    run: node_modules/.bin/tsx server/index.ts
    # Exactly one instance: Doop keeps canvases, WebSocket rooms and rate
    # limits in process memory, so a second instance would split them.
    instances: 1
    autoscaling:
      enabled: false
    cpuCores: 1
    # Node plus the Chromium used for screenshots and PDF exports.
    ramMegabytes: 2048
    port: 4400
    terminationGracePeriodSeconds: 30
    healthCheck:
      enabled: true
      httpPath: /healthz
    domains:
      - name: doop.hodlmarkets.com
    # The client sends no WebSocket heartbeat (src/lib/ws.ts), so the
    # ingress's default timeout would drop an idle canvas about once a minute.
    ingressAnnotations:
      nginx.ingress.kubernetes.io/proxy-connect-timeout: '60'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
      nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
      # The server's largest request body limit is 10 MB (font uploads).
      nginx.ingress.kubernetes.io/proxy-body-size: '16m'
    # Cloud SQL through the Cloud SQL Auth Proxy. Uncomment once the service
    # account is set in the cluster's Connections tab, and fill in the
    # instance's connection name (project-id:region:instance-name).
    # connections:
    #   - type: cloudSql
    #     config:
    #       cloudSqlServiceAccount: doop-cloudsql
    #       cloudSqlInstances:
    #         - connectionName: PROJECT_ID:REGION:doop-db
    #           databasePort: 5432
