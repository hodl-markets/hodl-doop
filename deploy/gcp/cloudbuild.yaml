# Builds Doop's image and deploys it to Cloud Run.
# Run from a checkout of this repository with `gcloud builds submit`, passing
# the commit as _TAG, the public address as _URL and the sign-up domain
# allowlist as _SIGNUP_DOMAINS. `gcloud builds submit` sets no SHORT_SHA, so
# the tag is a substitution of its own.
substitutions:
  _REGION: us-east1
  _TAG: ''
  _URL: ''
  _SIGNUP_DOMAINS: ''
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/doop/doop:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  # The client build (Vite) is the slow part; 8 vCPUs keep it to minutes.
  machineType: E2_HIGHCPU_8
timeout: 1800s
steps:
  - id: check-inputs
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        test -n "${_TAG}" || { echo "Pass the commit as _TAG: --substitutions=_TAG=<hash>"; exit 1; }
        test -n "${_URL}" || { echo "Pass the public address as _URL: --substitutions=_URL=https://<host>"; exit 1; }
        test -n "${_SIGNUP_DOMAINS}" || { echo "Pass the sign-up domains as _SIGNUP_DOMAINS: --substitutions=_SIGNUP_DOMAINS=<domain>"; exit 1; }
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        sed -e 's|__IMAGE__|${_IMAGE}|g' -e 's|__PROJECT__|${PROJECT_ID}|g' -e 's|__REGION__|${_REGION}|g' \
          -e 's|__URL__|${_URL}|g' -e 's|__SIGNUP_DOMAINS__|${_SIGNUP_DOMAINS}|g' \
          deploy/gcp/service.yaml > /workspace/service.yaml
        gcloud run services replace /workspace/service.yaml --region='${_REGION}'
  # Doop must run as one copy. Each revision keeps its own minimum of one
  # instance, so a revision that no longer takes traffic keeps running, and
  # keeps the WebSockets it holds, until it is deleted.
  # Deleting it shuts its instance down: Doop saves pending writes on SIGTERM,
  # and open canvases reconnect to the new revision 1.2 s later.
  - id: retire-old-revisions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # value() joins several revisions with ';'
        serving=" $$(gcloud run services describe doop --region='${_REGION}' --format='value(status.traffic[].revisionName)' | tr ';' ' ') "
        echo "serving:$$serving"
        for rev in $$(gcloud run revisions list --service=doop --region='${_REGION}' --format='value(metadata.name)'); do
          case "$$serving" in
            *" $$rev "*) ;;
            *) echo "deleting $$rev"; gcloud run revisions delete "$$rev" --region='${_REGION}' --quiet ;;
          esac
        done
images:
  - ${_IMAGE}
