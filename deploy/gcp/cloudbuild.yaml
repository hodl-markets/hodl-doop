# Builds Doop's image and deploys it to Cloud Run.
# Run by a Cloud Build trigger on a branch of this repository, with the
# public address as _URL and the sign-up domain allowlist as _SIGNUP_DOMAINS.
substitutions:
  _REGION: us-east1
  _URL: ''
  _SIGNUP_DOMAINS: ''
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/doop/doop:${SHORT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 1800s
steps:
  - id: check-inputs
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        test -n "${_URL}" || { echo "Pass the public address as _URL: --substitutions=_URL=https://<host>"; exit 1; }
        test -n "${_SIGNUP_DOMAINS}" || { echo "Pass the sign-up domains as _SIGNUP_DOMAINS: --substitutions=_SIGNUP_DOMAINS=<domain>"; exit 1; }
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        sed -e 's|__IMAGE__|${_IMAGE}|g' -e 's|__PROJECT__|${PROJECT_ID}|g' -e 's|__REGION__|${_REGION}|g' \
          -e 's|__URL__|${_URL}|g' -e 's|__SIGNUP_DOMAINS__|${_SIGNUP_DOMAINS}|g' \
          deploy/gcp/service.yaml > /workspace/service.yaml
        gcloud run services replace /workspace/service.yaml --region='${_REGION}'
images:
  - ${_IMAGE}
