# Builds Doop's image and deploys it to Cloud Run (docs/deploy-gcp.md).
# Run from a checkout of hodl-doop with `gcloud builds submit`, as `doop-build`,
# passing the commit as _TAG (docs/deploy-gcp.md, Deploy). `gcloud builds submit`
# sets no SHORT_SHA, so the tag is a substitution of its own.
substitutions:
  _REGION: us-east1
  _TAG: ''
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/doop/doop:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  # The client build (Vite) is the slow part; 8 vCPUs keep it to minutes.
  machineType: E2_HIGHCPU_8
timeout: 1800s
steps:
  - id: check-tag
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'test -n "${_TAG}" || { echo "Pass the commit as _TAG: --substitutions=_TAG=<hash>"; exit 1; }']
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        sed -e 's|__IMAGE__|${_IMAGE}|g' -e 's|__PROJECT__|${PROJECT_ID}|g' -e 's|__REGION__|${_REGION}|g' \
          deploy/gcp/service.yaml > /workspace/service.yaml
        gcloud run services replace /workspace/service.yaml --region='${_REGION}'
images:
  - ${_IMAGE}
